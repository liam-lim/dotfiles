<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <!-- Target ONLY Foot terminal -->
    <test name="prgname">
      <string>foot</string>
    </test>
    <!-- Target ONLY the JetBrainsMono font -->
    <test name="family">
      <string>JetBrainsMono Nerd Font</string>
    </test>

    <!-- Multiply font size by 1.33x -->
    <edit name="size" mode="assign">
      <times>
        <name>size</name>
        <double>1.33</double>
      </times>
    </edit>
  </match>
</fontconfig>
